<p-toast />

<div class="users-page">
  <div class="page-header">
    <div>
      <h2>User Management</h2>
      <p>Manage system users and their access levels</p>
    </div>
    <p-button label="New User" icon="pi pi-plus" />
  </div>

  <div class="card">
    <p-table
      #dt
      [value]="users"
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]"
      [globalFilterFields]="['name', 'email', 'role']"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
    >
      <ng-template #caption>
        <div class="table-toolbar">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search" />
            <input
              pInputText
              type="text"
              placeholder="Search users..."
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
            />
          </p-iconfield>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th pSortableColumn="name">User <p-sortIcon field="name" /></th>
          <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
          <th pSortableColumn="role">Role <p-sortIcon field="role" /></th>
          <th>Status</th>
          <th class="col-actions">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr>
          <td>
            <div class="user-cell">
              <div class="avatar">{{ getInitials(user.name) }}</div>
              <span class="user-name">{{ user.name }}</span>
            </div>
          </td>
          <td class="text-muted">{{ user.email }}</td>
          <td><p-tag [value]="user.role" [severity]="getRoleSeverity(user.role)" /></td>
          <td>
            <div class="status-cell">
              <p-toggleswitch
                [ngModel]="user.isActive"
                (ngModelChange)="toggleStatus(user, $event)"
              />
              <span class="status-label" [class.active]="user.isActive">
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </span>
            </div>
          </td>
          <td>
            <div class="action-buttons">
              <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info"   size="small" />
              <p-button icon="pi pi-trash"  [rounded]="true" [text]="true" severity="danger" size="small" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <p>No users found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
