<div class="page-header">
  <div>
    <h2>New User</h2>
    <p>Add a new system user</p>
  </div>
  <app-base-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
</div>

<div class="form-card">
  <form [formGroup]="form" class="dialog-form">

    <app-base-input formControlName="fullName" label="Full Name *" placeholder="Full name" />

    <app-base-input formControlName="email" label="Email *" placeholder="Email address" type="email" />

    <app-base-input formControlName="password" label="Password *" placeholder="Password" type="password" />

    <div class="field">
      <label>Role *</label>
      <p-select
        formControlName="role"
        [options]="roleOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select role"
        appendTo="body"
      />
    </div>

    <div class="form-actions">
      <app-base-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <app-base-button label="Create User" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
    </div>

  </form>
</div>
