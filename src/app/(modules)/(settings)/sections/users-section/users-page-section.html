<div class="page-header">
  <div>
    <h3>User Management</h3>
    <p>Manage system users and access levels</p>
  </div>
  <p-button label="New User" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<div class="card">

  <div class="table-toolbar">
    <p-iconfield>
      <p-inputicon styleClass="pi pi-search" />
      <input pInputText type="text" placeholder="Search users..."
        [ngModel]="query()" (ngModelChange)="query.set($event)" />
    </p-iconfield>
  </div>

  <p-table
    [value]="filtered()"
    [loading]="loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10,25,50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
  >

    <ng-template #header>
      <tr>
        <th pSortableColumn="name">User <p-sortIcon field="name" /></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
        <th pSortableColumn="role">Role <p-sortIcon field="role" /></th>
        <th>Status</th>
        <th class="col-actions">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr>
        <td>
          <div class="user-cell">
            <div class="avatar">{{ getInitials(user.name) }}</div>
            <span class="name">{{ user.name }}</span>
          </div>
        </td>
        <td class="muted">{{ user.email }}</td>
        <td><p-tag [value]="user.role" [severity]="getRoleSeverity(user.role)" /></td>
        <td>
          <div class="status-cell">
            <p-toggleswitch [ngModel]="user.isActive" (ngModelChange)="toggleStatus(user, $event)" />
            <span class="status-lbl" [class.active]="user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </div>
        </td>
        <td>
          <div class="actions">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info"   size="small" (onClick)="openEdit(user)" />
            <p-button icon="pi pi-trash"  [rounded]="true" [text]="true" severity="danger" size="small" (onClick)="delete(user)" />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr><td colspan="5"><div class="empty"><i class="pi pi-users"></i><p>No users found</p></div></td></tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="isEditing() ? 'Edit User' : 'New User'"
  [visible]="showDialog()"
  (visibleChange)="showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '460px' }"
>
  @if (!isEditing()) {
    <form [formGroup]="form" (ngSubmit)="save()" novalidate class="dialog-form">
      <div class="field">
        <label>Full Name *</label>
        <input pInputText formControlName="fullName" placeholder="Full name" />
      </div>
      <div class="field">
        <label>Email *</label>
        <input pInputText formControlName="email" type="email" placeholder="Email address" />
      </div>
      <div class="field">
        <label>Password *</label>
        <input pInputText formControlName="password" type="password" placeholder="Password" />
      </div>
      <div class="field">
        <label>Role *</label>
        <p-select formControlName="role" [options]="roleOptions" placeholder="Select role" styleClass="full-w" />
      </div>
    </form>
  } @else {
    <form [formGroup]="editForm" (ngSubmit)="save()" novalidate class="dialog-form">
      <div class="field">
        <label>Full Name *</label>
        <input pInputText formControlName="fullName" placeholder="Full name" />
      </div>
      <div class="field">
        <label>Role *</label>
        <p-select formControlName="role" [options]="roleOptions" placeholder="Select role" styleClass="full-w" />
      </div>
      <div class="field-row">
        <label class="checkbox-label">
          <p-checkbox formControlName="isActive" [binary]="true" />
          Active
        </label>
      </div>
    </form>
  }

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="showDialog.set(false)" />
    <p-button
      [label]="isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="saving()"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
