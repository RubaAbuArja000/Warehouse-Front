<div class="page-header">
  <div>
    <h2>New User</h2>
    <p>Add a new system user</p>
  </div>
  <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
</div>

<div class="form-card">
  <form [formGroup]="form" class="dialog-form">

    <div class="field">
      <label for="fullName">Full Name *</label>
      <input id="fullName" pInputText formControlName="fullName" placeholder="Full name" />
    </div>

    <div class="field">
      <label for="email">Email *</label>
      <input id="email" pInputText formControlName="email" type="email" placeholder="Email address" />
    </div>

    <div class="field">
      <label for="password">Password *</label>
      <input id="password" pInputText formControlName="password" type="password" placeholder="Password" />
    </div>

    <div class="field">
      <label>Role *</label>
      <p-select
        formControlName="role"
        [options]="roleOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="Select role"
        appendTo="body"
      />
    </div>

    <div class="form-actions">
      <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="cancel()" />
      <p-button label="Create User" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
    </div>

  </form>
</div>
