<div class="page-header">
  <h3>User Management</h3>
  <p-button label="New User" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<div class="card">
  <div class="table-toolbar">
    <app-search-box
      [value]="state.query()"
      (valueChange)="state.query.set($event)"
      placeholder="Search users..."
    />
  </div>

  <p-table
    [value]="state.filtered()"
    [loading]="state.loading()"
    [paginator]="true"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="name">User <p-sortIcon field="name" /></th>
        <th pSortableColumn="email">Email <p-sortIcon field="email" /></th>
        <th pSortableColumn="role">Role <p-sortIcon field="role" /></th>
        <th>Status</th>
        <th class="col-actions">Actions</th>
      </tr>
    </ng-template>

    <ng-template #body let-user>
      <tr>
        <td>
          <div class="user-cell">
            <div class="avatar">{{ getInitials(user.name) }}</div>
            <span class="name">{{ user.name }}</span>
          </div>
        </td>
        <td class="muted">{{ user.email }}</td>
        <td><p-tag [value]="user.role" [severity]="getRoleSeverity(user.role)" /></td>
        <td>
          <div class="status-cell">
            <p-toggleswitch
              [ngModel]="user.isActive"
              (ngModelChange)="state.toggleStatus(user, $event)"
            />
            <span class="status-lbl" [class.active]="user.isActive">
              {{ user.isActive ? 'Active' : 'Inactive' }}
            </span>
          </div>
        </td>
        <td>
          <div class="actions">
            <p-button
              icon="pi pi-pencil"
              [rounded]="true" [text]="true"
              severity="info" size="small"
              (onClick)="openEdit(user)"
            />
            <p-button
              icon="pi pi-trash"
              [rounded]="true" [text]="true"
              severity="danger" size="small"
              (onClick)="state.delete(user)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <div class="empty">
            <i class="pi pi-users"></i>
            <p>No users found</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
