<div class="section-label">Warehouse Status</div>

@if (loading()) {
  <div class="status-grid skeleton-grid">
    @for (_ of [1,2,3,4]; track $index) {
      <div class="status-card skeleton"></div>
    }
  </div>
} @else {
  <div class="status-grid">
    @for (w of status(); track w.warehouseId) {
      <div class="status-card">
        <div class="card-icon"><i class="pi pi-building"></i></div>
        <div class="card-body">
          <span class="card-value">{{ w.totalItems | number }}</span>
          <span class="card-name">{{ w.warehouseName }}</span>
        </div>
      </div>
    }
    @if (status().length === 0) {
      <p class="empty">No warehouses found.</p>
    }
  </div>
}
