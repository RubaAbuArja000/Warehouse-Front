<div class="page">
  <app-inventory-header (addClicked)="openCreate()" />

  <app-inventory-table
    [items]="filtered()"
    [loading]="loading()"
    [query]="query()"
    [filterWh]="filterWh()"
    [warehouseOptions]="warehouseOptions()"
    (queryChange)="query.set($event)"
    (filterWhChange)="filterWh.set($event)"
    (editItem)="openEdit($event)"
    (deleteItem)="delete($event)"
  />
</div>

<p-dialog
  [header]="isEditing() ? 'Edit Item' : 'New Item'"
  [visible]="showDialog()"
  (visibleChange)="showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '520px' }"
>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="dialog-form">
    <div class="field">
      <label>Item Name *</label>
      <input pInputText formControlName="itemName" placeholder="e.g. Safety Gloves" />
    </div>
    <div class="field">
      <label>SKU Code</label>
      <input pInputText formControlName="skuCode" placeholder="Optional SKU" />
    </div>
    <div class="field">
      <label>Warehouse *</label>
      <p-select
        formControlName="warehouseId"
        [options]="warehouseOptions()"
        placeholder="Select warehouse"
        styleClass="full-w"
      />
    </div>
    <div class="field-row">
      <div class="field">
        <label>Quantity *</label>
        <p-inputnumber formControlName="quantity" [min]="1" styleClass="full-w" />
      </div>
      <div class="field">
        <label>Cost Price *</label>
        <p-inputnumber
          formControlName="costPrice"
          mode="currency"
          currency="USD"
          styleClass="full-w"
        />
      </div>
    </div>
    <div class="field">
      <label>MSRP</label>
      <p-inputnumber
        formControlName="msrpPrice"
        mode="currency"
        currency="USD"
        styleClass="full-w"
      />
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="showDialog.set(false)" />
    <p-button
      [label]="isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="form.invalid"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
