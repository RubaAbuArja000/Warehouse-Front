<div class="page">
  <app-inventory-header />
  <app-inventory-table />
</div>

<p-dialog
  [header]="state.isEditing() ? 'Edit Item' : 'New Item'"
  [visible]="state.showDialog()"
  (visibleChange)="state.showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '520px' }"
>
  <form [formGroup]="state.form" (ngSubmit)="state.save()" novalidate class="dialog-form">
    <app-base-input
      formControlName="itemName"
      label="Item Name *"
      placeholder="e.g. Safety Gloves"
    />
    <app-base-input formControlName="skuCode" label="SKU Code" placeholder="Optional SKU" />

    <div class="field">
      <label>Warehouse *</label>
      <p-select
        formControlName="warehouseId"
        [options]="state.warehouseOptions()"
        placeholder="Select warehouse"
        styleClass="full-w"
      />
    </div>

    <div class="field-row">
      <div class="field">
        <label>Quantity *</label>
        <p-inputnumber formControlName="quantity" [min]="1" />
      </div>

      <div class="field">
        <label>Cost Price *</label>
        <p-inputnumber formControlName="costPrice" mode="currency" currency="USD" />
      </div>
    </div>

    <div class="field">
      <label>MSRP</label>
      <p-inputnumber formControlName="msrpPrice" mode="currency" currency="USD" />
    </div>
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      (onClick)="state.showDialog.set(false)"
    />

    <p-button
      [label]="state.isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="state.saving()"
      [disabled]="state.form.invalid"
      (onClick)="state.save()"
    />
  </ng-template>
</p-dialog>
