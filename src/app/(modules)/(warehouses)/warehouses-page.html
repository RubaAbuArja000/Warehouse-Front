<div class="page">
  <app-warehouse-header (addClicked)="openCreate()" />

  <app-warehouse-table
    [items]="filtered()"
    [loading]="loading()"
    [query]="query()"
    (queryChange)="onQueryChange($event)"
    (editWarehouse)="openEdit($event)"
    (deleteWarehouse)="delete($event)"
  />
</div>

<p-dialog
  [header]="isEditing() ? 'Edit Warehouse' : 'New Warehouse'"
  [visible]="showDialog()"
  (visibleChange)="showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '480px' }"
>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="dialog-form">
    <div class="field">
      <label>Name *</label>
      <input pInputText formControlName="name" placeholder="Warehouse name" />
    </div>

    <div class="field">
      <label>Address *</label>
      <input pInputText formControlName="address" placeholder="Street address" />
    </div>

    <div class="field-row">
      <div class="field">
        <label>City *</label>
        <input pInputText formControlName="city" placeholder="City" />
      </div>

      <div class="field">
        <label>Country *</label>
        <input pInputText formControlName="country" placeholder="Country" />
      </div>
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="showDialog.set(false)" />
    <p-button
      [label]="isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="form.invalid"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
