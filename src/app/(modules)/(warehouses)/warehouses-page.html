<p-toast />
<p-confirmdialog />

<div class="page">
  <div class="page-header">
    <div>
      <h2>Warehouses</h2>
      <p>Manage warehouse locations</p>
    </div>
    <p-button label="New Warehouse" icon="pi pi-plus" (onClick)="openCreate()" />
  </div>

  <div class="card">
    <p-table
      [value]="filtered()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[10,25,50]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} warehouses"
    >
      <ng-template #caption>
        <div class="table-toolbar">
          <p-iconfield>
            <p-inputicon styleClass="pi pi-search" />
            <input pInputText type="text" placeholder="Search..."
              [ngModel]="query()" (ngModelChange)="query.set($event)" />
          </p-iconfield>
        </div>
      </ng-template>

      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th pSortableColumn="address">Address <p-sortIcon field="address" /></th>
          <th pSortableColumn="city">City <p-sortIcon field="city" /></th>
          <th pSortableColumn="country">Country <p-sortIcon field="country" /></th>
          <th class="col-actions">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-w>
        <tr>
          <td class="name-cell"><i class="pi pi-building"></i> {{ w.name }}</td>
          <td class="muted">{{ w.address }}</td>
          <td>{{ w.city }}</td>
          <td>{{ w.country }}</td>
          <td>
            <div class="actions">
              <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" severity="info"   size="small" (onClick)="openEdit(w)" />
              <p-button icon="pi pi-trash"  [text]="true" [rounded]="true" severity="danger" size="small" (onClick)="delete(w)" />
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr><td colspan="5"><div class="empty"><i class="pi pi-building"></i><p>No warehouses found</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  [header]="isEditing() ? 'Edit Warehouse' : 'New Warehouse'"
  [visible]="showDialog()"
  (visibleChange)="showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '480px' }"
>
  <form [formGroup]="form" (ngSubmit)="save()" novalidate class="dialog-form">
    <div class="field">
      <label>Name *</label>
      <input pInputText formControlName="name" placeholder="Warehouse name" />
    </div>
    <div class="field">
      <label>Address *</label>
      <input pInputText formControlName="address" placeholder="Street address" />
    </div>
    <div class="field-row">
      <div class="field">
        <label>City *</label>
        <input pInputText formControlName="city" placeholder="City" />
      </div>
      <div class="field">
        <label>Country *</label>
        <input pInputText formControlName="country" placeholder="Country" />
      </div>
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancel" severity="secondary" [text]="true" (onClick)="showDialog.set(false)" />
    <p-button
      [label]="isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="form.invalid"
      (onClick)="save()"
    />
  </ng-template>
</p-dialog>
