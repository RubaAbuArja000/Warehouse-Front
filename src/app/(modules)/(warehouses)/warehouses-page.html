<div class="page">
  <app-warehouse-header />
  <app-warehouse-table />
</div>

<p-dialog
  [header]="state.isEditing() ? 'Edit Warehouse' : 'New Warehouse'"
  [visible]="state.showDialog()"
  (visibleChange)="state.showDialog.set($event)"
  [modal]="true"
  [style]="{ width: '480px' }"
>
  <form [formGroup]="state.form" (ngSubmit)="state.save()" novalidate class="dialog-form">
    <app-base-input formControlName="name" label="Name *" placeholder="Warehouse name" />

    <app-base-input formControlName="address" label="Address *" placeholder="Street address" />

    <div class="field-row">
      <app-base-input formControlName="city" label="City *" placeholder="City" />

      <app-base-input formControlName="country" label="Country *" placeholder="Country" />
    </div>
  </form>

  <ng-template #footer>
    <app-base-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      (onClick)="state.showDialog.set(false)"
    />

    <app-base-button
      [label]="state.isEditing() ? 'Update' : 'Create'"
      icon="pi pi-check"
      [loading]="state.saving()"
      [disabled]="state.form.invalid"
      (onClick)="state.save()"
    />
  </ng-template>
</p-dialog>
