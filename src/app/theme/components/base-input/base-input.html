<div class="base-field">
  @if (label()) {
    <label class="base-label">{{ label() }}</label>
  }

  <input
    pInputText
    class="base-input-el"
    [type]="type()"
    [placeholder]="placeholder()"
    [attr.disabled]="disabled() ? '' : null"
    [ngModel]="value()"
    (ngModelChange)="onValueChange($event)"
    (blur)="onBlur()"
  />
</div>
